<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Club Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{background:#F5F3EA;-webkit-text-size-adjust:100%}
#root{margin:0;width:100%;min-height:100vh;min-height:100dvh}

/* Pantalla completa (escritorio): sidebar fija y contenido ocupando todo el alto/ancho */
.app-root{min-height:100vh;min-height:100dvh;width:100%}
.app-sidebar{height:100vh;height:100dvh;position:sticky;top:0;overflow-y:auto}
.app-main{height:100vh;height:100dvh;min-width:0}
.app-main img,.app-main canvas,.app-main svg{max-width:100%}
.app-main input,.app-main select,.app-main textarea{max-width:100%}

/* Tablets y celulares */
@media (max-width:900px){
  .app-main{padding:20px 16px !important}
}
@media (max-width:768px){
  .app-root{flex-direction:column !important;height:auto}
  .app-sidebar{
    width:100% !important;min-width:0 !important;height:auto !important;position:sticky;top:0;z-index:50;
    padding:10px 0 0 0 !important;overflow:visible;
  }
  .app-sidebar > div:first-child{padding:0 14px 10px 14px !important}
  .app-nav{
    flex-direction:row !important;gap:6px !important;padding:8px 10px !important;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .app-nav::-webkit-scrollbar{display:none}
  .app-nav .nav-btn{flex:0 0 auto;white-space:nowrap;padding:9px 12px !important;font-size:13px !important}
  .app-main{height:auto !important;overflow-y:visible !important;overflow-x:hidden;padding:16px 12px calc(24px + env(safe-area-inset-bottom)) !important}

  /* anchos fijos que desbordan en pantallas chicas */
  .app-main [style*="min-width: 300px"],.app-main [style*="min-width: 220px"],.app-main [style*="min-width: 180px"]{min-width:0 !important}
  .app-main [style*="width: 260px"],.app-main [style*="max-width: 380px"],.app-main [style*="max-width: 320px"]{max-width:100% !important}
  .app-main [style*="display: flex"]{flex-wrap:wrap}
  .app-main button,.app-main select,.app-main input{min-height:36px}
  .app-main input,.app-main select,.app-main textarea{font-size:16px !important} /* evita el zoom automático en iOS */

  /* grillas de 3 columnas -> 1 columna */
  .app-main [style*="grid-template-columns: 1fr 1fr 1fr"],
  .app-main [style*="grid-template-columns: 1fr 1fr 1.4fr"],
  .app-main [style*="grid-template-columns: 0.8fr 0.8fr 1fr"]{grid-template-columns:1fr !important}

  /* ===== Tablas: se adaptan al ancho del celular, sin scroll lateral ===== */
  /* tablas reales (<table>) */
  :is(.app-main,.zfm-body,.zrv-modal) table:not([style*="table-layout"]){width:100% !important;min-width:0 !important}
  :is(.app-main,.zfm-body,.zrv-modal) table:not([style*="table-layout"]) :is(th,td){white-space:normal !important;padding:7px 3px !important;font-size:10.5px !important;letter-spacing:0 !important;line-height:1.25;overflow-wrap:break-word;word-break:normal}
  :is(.app-main,.zfm-body,.zrv-modal) table:not([style*="table-layout"]) th{font-size:9px !important;overflow-wrap:normal}
  :is(.app-main,.zfm-body,.zrv-modal) table:not([style*="table-layout"]) :is(th,td):first-child{padding-left:8px !important}
  :is(.app-main,.zfm-body,.zrv-modal) table:not([style*="table-layout"]) :is(th,td):last-child{padding-right:8px !important}
  /* tablas hechas con grid (filas de div) */
  :is(.app-main,.zfm-body) :is([style*="1.4fr 0.7fr 0.6fr"],[style*="0.9fr 1.3fr 1fr 0.7fr"],[style*="0.4fr 1.3fr 1.3fr 0.6fr"]){min-width:0 !important;gap:4px;padding-left:8px !important;padding-right:8px !important;font-size:11px !important;letter-spacing:0 !important}
  :is(.app-main,.zfm-body) :is([style*="1.4fr 0.7fr 0.6fr"],[style*="0.9fr 1.3fr 1fr 0.7fr"],[style*="0.4fr 1.3fr 1.3fr 0.6fr"]) > *{min-width:0;overflow-wrap:anywhere}
  :is(.app-main,.zfm-body) :is([style*="1.4fr 0.7fr 0.6fr"],[style*="0.9fr 1.3fr 1fr 0.7fr"],[style*="0.4fr 1.3fr 1.3fr 0.6fr"])[style*="letter-spacing"]{font-size:8.5px !important}
  :is(.app-main,.zfm-body) :is([style*="1.4fr 0.7fr 0.6fr"],[style*="0.9fr 1.3fr 1fr 0.7fr"],[style*="0.4fr 1.3fr 1.3fr 0.6fr"])[style*="letter-spacing"] > *{overflow-wrap:normal}
  .app-main [style*="1.4fr 0.7fr 0.6fr"]{grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,0.9fr)) repeat(2,minmax(0,0.7fr)) repeat(2,minmax(0,0.5fr)) !important}
  .app-main [style*="0.9fr 1.3fr 1fr 0.7fr"]{grid-template-columns:minmax(0,0.9fr) minmax(0,1.1fr) minmax(0,1fr) minmax(0,0.8fr) minmax(0,0.8fr) auto !important;padding-left:6px !important;padding-right:6px !important}
  .app-main [style*="0.9fr 1.3fr 1fr 0.7fr"] > span:last-child{flex-wrap:nowrap !important;gap:2px !important}
  .app-main [style*="0.9fr 1.3fr 1fr 0.7fr"] > span:last-child button{padding:2px !important;min-height:0 !important}
  /* formularios en filas de varias columnas: pasan a 2 columnas */
  .app-main :is([style*="1.3fr 1fr 0.6fr 0.7fr"],[style*="0.8fr 0.6fr 1.2fr"],[style*="0.8fr 1fr 0.7fr 0.7fr"]){grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  .app-main :is([style*="1fr 0.3fr 1fr 0.5fr"],[style*="1.3fr 0.5fr 1fr 1.1fr"]) > *{min-width:0}
  .app-main :is([style*="1fr 0.3fr 1fr 0.5fr"],[style*="1.3fr 0.5fr 1fr 1.1fr"]) :is(select,input){width:100%;padding-left:4px !important;padding-right:4px !important}
  /* tarjetas de Análisis: una columna, nunca más anchas que la pantalla */
  .app-main [style*="minmax(300px, 1fr)"]{grid-template-columns:minmax(0,1fr) !important}
  .app-main [style*="flex: 1 1 300px"],.app-main [style*="flex: 1 1 260px"]{flex-basis:100% !important}
  .app-main [style*="min-width: 130px"]{min-width:0 !important}
  /* barras apiladas V/E/D: los segmentos no deben saltar de línea */
  .app-main [style*="height: 9px"][style*="display: flex"]{flex-wrap:nowrap !important}
  /* vallas: todas las jornadas entran en el ancho de la pantalla */
  .app-main [style*="minmax(34px"]{grid-template-columns:none !important;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px !important}
  .app-main [style*="minmax(34px"] > div{font-size:9px !important}
  .app-main [style*="overflow-x: auto"] > [style*="min-width"]{min-width:0 !important}
}
@media (max-width:420px){
  .app-main{padding:12px 10px calc(20px + env(safe-area-inset-bottom)) !important}
}
@media print{.app-sidebar,.app-main{height:auto !important;position:static}}

/* Nombre de equipo clickeable -> ficha de rival */
.zrv-link{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.zrv-link:hover{opacity:.75}
.zrv-link:focus-visible{outline:2px solid #E3A83B;outline-offset:2px;border-radius:3px}
.zrv-modal [style*="display: flex"]{flex-wrap:wrap}
@media (max-width:760px){.zrv-modal{padding:0 !important}.zrv-card{border-radius:0 !important;min-height:100%}}
@media print{.zrv-link{text-decoration:none !important}}
</style>

  var MAP={"argentino-penarol": ["argentino penarol", "argentino", "a. penarol", "c.a. argentino penarol"], "barrio-parque": ["barrio parque"], "camioneros": ["camioneros", "cacc"], "cibi": ["cibi"], "lasallano": ["deportivo lasallano", "lasallano", "csd lasallano", "d. lasallano"], "las-palmas": ["las palmas", "deportivo las palmas", "d. las palmas"], "libertad": ["libertad"], "los-andes": ["los andes"], "racing": ["racing"], "san-lorenzo": ["san lorenzo"], "talleres": ["talleres"], "amsurrbac": ["amsurrbac"], "atalaya": ["deportivo atalaya", "atalaya", "d. atalaya", "cd atalaya"], "belgrano": ["belgrano"], "bella-vista": ["bella vista"], "escuela-pte-roca": ["escuela pte roca", "escuela pte. roca", "escuela presidente roca", "escuela roca", "pte roca", "pte. roca"], "general-paz-juniors": ["general paz juniors", "gral paz juniors", "gral. paz juniors", "general paz jrs", "gpj"], "huracan": ["huracan", "club atletico huracan"], "instituto": ["instituto"], "union-san-vicente": ["union san vicente", "u. san vicente", "u san vicente", "usv"], "universitario": ["universitario"], "villa-azalais": ["villa azalais"]};
  var IDX={};
  Object.keys(MAP).forEach(function(k){MAP[k].forEach(function(n){IDX[n]=k})});
  function norm(s){return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim()}
  var SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,INPUT:1,OPTION:1,SELECT:1,TITLE:1,NOSCRIPT:1,SVG:1,TEXT:1,TSPAN:1};
  var pend=false;
  function keyOf(txt){var n=norm(txt);return n&&n.length<40?IDX[n]:undefined}
  function scan(){
    pend=false;
    /* 1) revalidar los ya marcados (React puede reutilizar el nodo con otro texto) */
    var old=document.querySelectorAll("[data-zesc]");
    for(var i=0;i<old.length;i++){var el=old[i];var kk=keyOf(el.textContent);if(kk!==el.getAttribute("data-zesc")){if(kk)el.setAttribute("data-zesc",kk);else el.removeAttribute("data-zesc")}}
    /* 2) marcar los nuevos: elemento cuyo unico contenido es el nombre del equipo */
    var roots=[document.getElementById("root"),document.querySelector(".print-only")];
    roots.forEach(function(r){
      if(!r)return;
      var w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT,null),n;
      while((n=w.nextNode())){
        var p=n.parentNode;
        if(!p||p.nodeType!==1||SKIP[p.tagName.toUpperCase()]||p.hasAttribute("data-zesc"))continue;
        var k=keyOf(n.nodeValue);if(!k)continue;
        if(p.children.length>0)continue;
        if(norm(p.textContent)!==norm(n.nodeValue))continue;
        p.setAttribute("data-zesc",k);
      }
    });
  }
  function sched(){if(pend)return;pend=true;(window.requestAnimationFrame||setTimeout)(scan)}
  function start(){
    scan();
    try{new MutationObserver(sched).observe(document.body,{childList:true,subtree:true,characterData:true})}catch(e){}
    window.addEventListener("beforeprint",scan);
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);else start();
})();
</script>
</body>
</html>
